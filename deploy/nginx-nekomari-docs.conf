##
# nekomari-docs.66040321.xyz — the Nekomari documentation site
#
# Structure matches the host's other vhosts (nekomari / vault / git / blog):
#   * port 80 only redirects; TLS terminates on 443
#   * the certificate is a Cloudflare **Origin** certificate (`*.66040321.xyz`), which is why the Cloudflare
#     proxy must stay on: an Origin certificate is signed by Cloudflare's own CA, so a browser reaching the
#     origin directly rejects it
#   * the backend is a static container on loopback, never reached from the public network
#
# The difference from the panel's vhost is what is *absent*: **no WebSocket**. This site serves files, so it
# needs no Upgrade/Connection passthrough and no widened read timeout. Copying those two lines from the panel
# vhost would be harmless and would suggest a requirement that does not exist.
#
# `CF-Connecting-IP` is deliberately not consulted. This site records no visitor addresses and applies no
# per-IP limits, so there is nothing to get right — which also means one fewer place that has to decide whether
# a header can be trusted. See `deploy/nginx-nekomari.conf` for why that decision is delicate where it *does*
# matter.
##
server {
    listen 80;
    listen [::]:80;
    server_name nekomari-docs.66040321.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nekomari-docs.66040321.xyz;

    ssl_certificate     /etc/nginx/ssl/66040321.pem;
    ssl_certificate_key /etc/nginx/ssl/66040321.key;

    location / {
        proxy_pass http://127.0.0.1:25775;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
