##
# nekomari.orderly2233.org — Nekomari 面板
#
# 结构与本机其它 vhost（vault / git / dav / blog）保持一致：
#   * 80 端口只做 301，TLS 一律终止在 443；
#   * 证书用 /etc/nginx/ssl 下的共用 Cloudflare Origin 证书（wildcard）；
#   * 后端只监听回环，公网不经由面板端口直连。
#
# 与其它 vhost 的差别只有一处：面板依赖 WebSocket（探针长连接、实时指标），
# 因此 Upgrade / Connection 头必须透传，且读超时必须放宽 —— 探针空闲时
# 连接会保持很久，默认 60s 会被 nginx 掐断，表现为面板上节点反复上下线。
#
# 真实来源 IP 的链路：Cloudflare -> nginx。nginx 把 CF-Connecting-IP 覆盖进
# X-Real-IP / X-Forwarded-For，面板据此记录客户端 IP，而不是把 Cloudflare
# 的边缘地址当成访客地址。
##

server {
    listen 80;
    listen [::]:80;
    server_name komari.orderly2233.org nekomari.orderly2233.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name komari.orderly2233.org nekomari.orderly2233.org;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 主题背景与预览图可能较大（LuminaPlus 的背景动辄数 MB）。
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:25774;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Cloudflare 边缘地址会覆盖真实访客地址，优先取 CF-Connecting-IP；
        # 该头缺失时（例如从本机直接访问回环）回退到 $remote_addr，
        # 否则面板会记录到一个空的客户端地址。
        set $real_client_ip $http_cf_connecting_ip;
        if ($real_client_ip = "") {
            set $real_client_ip $remote_addr;
        }
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket：探针走 /v2/rpc 长连接，实时指标走 /api/ws。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 探针连接空闲时间很长，超时太短会让节点在面板上反复掉线。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }
}
