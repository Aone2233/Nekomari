##
# nekomari.orderly2233.org — Nekomari 面板
#
# 结构与本机其它 vhost（vault / git / dav / blog）保持一致：
#   * 80 端口只做 301，TLS 一律终止在 443；
#   * 证书用 /etc/nginx/ssl 下的共用 Cloudflare Origin 证书（wildcard）；
#   * 后端只监听回环，公网不经由面板端口直连。
#
# 与其它 vhost 的差别只有一处：面板依赖 WebSocket（探针长连接、实时指标），
# 因此 Upgrade / Connection 头必须透传，且读超时必须放宽 —— 探针空闲时
# 连接会保持很久，默认 60s 会被 nginx 掐断，表现为面板上节点反复上下线。
#
# 真实来源 IP 的链路：Cloudflare -> nginx。nginx 把 CF-Connecting-IP 覆盖进
# X-Real-IP / X-Forwarded-For，面板据此记录客户端 IP，而不是把 Cloudflare 的
# 边缘地址当成访客地址。
#
# 【重要】CF-Connecting-IP 只有在直连来源确实是 Cloudflare 时才可信。
#
# 源站的 443 对公网开放，任何知道源站 IP 的人都能直接连上来并随手写一个
# CF-Connecting-IP。原来这里无条件采信它，后果不只是「IP 记错」：
#
#   * 面板的登录限流按 IP 计数 —— 每次换一个伪造头就等于换一个身份，按 IP 的那一维
#     完全失效，可以无限试密码与 2FA；
#   * 会话记录与审计日志里写入的是攻击者指定的地址。
#
# 所以先用 geo 判断「来源是不是 Cloudflare」，是才采信那个头。网段清单由
# deploy/update-cloudflare-ips.sh 生成（取自 Cloudflare 官方公开列表）。
#
# 注意：这一层挡的是「伪造来源」，挡不住「直接连源站」本身。要彻底关掉直连，还需要
# 在防火墙/安全组上把 443 限制到同一份 Cloudflare 网段 —— 两者是互补的，见
# deploy/README.md。
##
geo $nekomari_trust_cf {
    default 0;
    include /etc/nginx/cloudflare-ips.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name komari.orderly2233.org nekomari.orderly2233.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name komari.orderly2233.org nekomari.orderly2233.org;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 主题背景与预览图可能较大（LuminaPlus 的背景动辄数 MB）。
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:25774;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;

        # 只有直连来源在 Cloudflare 网段内时才采信 CF-Connecting-IP；否则一律用
        # $remote_addr。少了这层判断，伪造头会直接决定面板记录的客户端 IP，而它同时是
        # 登录限流的 key。
        set $real_client_ip $remote_addr;
        if ($nekomari_trust_cf) {
            set $real_client_ip $http_cf_connecting_ip;
        }
        # 来自 Cloudflare 但该头缺失（或为空）时回退，避免记录到空地址。
        if ($real_client_ip = "") {
            set $real_client_ip $remote_addr;
        }

        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket：探针走 /v2/rpc 长连接，实时指标走 /api/ws。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 探针连接空闲时间很长，超时太短会让节点在面板上反复掉线。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }
}
