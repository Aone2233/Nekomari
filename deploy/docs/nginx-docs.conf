# nginx for the documentation container.
#
# This serves static files and nothing else. TLS is terminated outside — see deploy/docs/README.md — so this
# only has to be correct about caching and about not inventing a directory listing.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `sitemap.xml` and the search index are generated per build; serving them from a stale cache would show
    # the previous release's page list.
    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
    }

    # The site is static and its pages are few, so a modest cache is right: long enough to matter, short
    # enough that a corrected page does not stay wrong.
    location ~* \.(css|js|woff2?|png|svg|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # No directory listings: they leak the build's file layout and there is no legitimate reader for them.
    autoindex off;

    # The container is normally reached through a reverse proxy, so the client address is in a header. Not
    # trusted here — the proxy sets it and this file does not read it — but the access log is scoped down
    # because nobody reads per-request logs for a documentation site.
    access_log off;
    error_log /var/log/nginx/error.log warn;
}
