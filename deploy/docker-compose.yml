services:
  nekomari:
    image: ghcr.io/aone2233/nekomari:v0.1.14
    container_name: nekomari
    restart: unless-stopped
    # 与旧 Komari 实例一致：只监听回环，公网入口一律走宿主机 nginx。
    # 这样面板端口不直接暴露，Cloudflare 之后的真实来源 IP 也由 nginx 传递。
    ports:
      - "127.0.0.1:25774:25774"
    environment:
      TZ: Asia/Shanghai
      KOMARI_LISTEN: 0.0.0.0:25774
    volumes:
      # 绑定挂载而非命名卷：数据要能直接备份、直接替换（本次就是恢复了
      # 归档的 komari.db + metrics.db 之后启动的）。
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:25774/api/public > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    memswap_limit: 1g
