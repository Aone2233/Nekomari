name: docker

# 把已发布的二进制打包成多架构容器镜像，推到 GHCR。
#
# 设计说明
# --------
# 1) 为什么从 Release 附件构建，而不是在这里重新编译：
#    release.yml 已经按各平台原生构建好了产物（服务端依赖 CGO，交叉编译
#    需要额外工具链）。这里直接取用那些产物，既不必重复构建，也保证了
#    「镜像里的二进制」与「Release 里的二进制」是同一份。
#
# 2) Dockerfile 依赖产物位于构建上下文根目录且命名为 nekomari-<os>-<arch> /
#    komari-agent-linux-<arch>，这正是 release.yml 的命名，也是本工作流
#    --pattern 抓取的命名。改任意一边都必须同步改另一边。
#
# 3) 两个镜像由同一个矩阵构建，共用 tag 方案与全部检查：服务端
#    ghcr.io/<owner>/nekomari，探针 ghcr.io/<owner>/nekomari-agent。
#    探针镜像存在的原因：面板的「安装命令」对话框有 Docker 选项，此前它指向
#    上游的 komari-monitor/komari-agent 镜像 —— 那是另一个项目、没有本 fork 的
#    flag，且节点身份依赖 --auto-discovery。既然要装就装自己的版本。
#
# 4) 只推 GHCR（用内置 GITHUB_TOKEN，无需额外密钥）。
#    要同时推 Docker Hub 的话，需要 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 两个
#    secret，这里刻意不默认开启，避免缺密钥时整个流程失败。

on:
  release:
    types: [published]
  # release.yml 是用 GITHUB_TOKEN 创建 Release 的，而 GitHub 会抑制由
  # GITHUB_TOKEN 触发的事件 —— 所以 release:published 在自动发布时【不会】
  # 触发本工作流（实测 v0.1.1 就没有触发）。workflow_run 正是为这种串联场景
  # 设计的：等 release 工作流跑完再取产物打镜像。
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build an image for (e.g. v0.1.1)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # release 与 workflow_run 可能同时命中，按 tag 去重避免重复推送。
  group: docker-${{ github.event.inputs.tag || github.event.workflow_run.head_branch || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    # workflow_run 时不关心成功与否就白跑，先判断结论。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nekomari
            package: nekomari
            # 服务端镜像名就是仓库名；探针加 -agent 后缀（ghcr.io/<owner>/nekomari-agent）。
            image_suffix: ""
            dockerfile: Dockerfile
            entrypoint: /app/nekomari
            smoke_expect: Monitor
            smoke_args: --help
          - name: nekomari-agent
            package: nekomari-agent
            image_suffix: "-agent"
            dockerfile: Dockerfile.agent
            entrypoint: /usr/local/bin/komari-agent
            # 探针没有 --version（实测报 unknown flag），--help 才是稳定入口。
            smoke_expect: komari agent
            smoke_args: --help
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            # workflow_run：tag 推送触发的 run 会把 tag 放在 head_branch 上。
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::resolved tag '$TAG' does not look like a release tag; nothing to build"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # GHCR 的仓库名必须小写，而 github.repository 是 Aone2233/Nekomari。
          # 自己转一次，不依赖 metadata-action 的行为。
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.name }} image for $TAG as $IMAGE"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 用 tag 本身而不是默认分支，保证 Dockerfile 与产物同代。
          ref: ${{ steps.tag.outputs.tag || github.ref }}

      # docker/build-push-action 的 file 是相对 context 解析的，
      # 所以 Dockerfile 必须和二进制放在同一个目录里。
      - name: Assemble the build context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ctx
          # 两个 Dockerfile 都必须在这个 tag 里：它们属于该次发布，从 tag 取才能保证
          # 「镜像定义」与「它打包的二进制」同代。早于 Dockerfile.agent 的 tag
          # （例如 v0.1.14）做不出探针镜像 —— 这里直接说清楚，而不是让 cp 报一句
          # "No such file or directory"。
          for f in Dockerfile Dockerfile.agent; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is not in ${{ steps.tag.outputs.tag }}: that tag predates it, so it cannot build these images. Cut a release that contains it."
              exit 1
            fi
          done
          cp Dockerfile Dockerfile.agent ctx/
          # 服务端产物：nekomari-*；探针产物只取 linux（镜像跑在 linux 上，
          # darwin/windows 的探针不可能是容器）。
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'nekomari-*' \
            --pattern 'komari-agent-linux-*' \
            --dir ctx
          ls -la ctx

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.tag.outputs.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.tag.outputs.tag, '-') }}
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }}

      # 冒烟测试：镜像必须真的能跑起来。
      #
      # 为什么必须有这一步：下面那个「匿名可拉取」检查只验证 manifest 能取到，
      # 也就是「镜像存在」。它不关心容器能不能启动 —— 而镜像【存在但启动即崩】
      # 是完全可能的，v0.1.1 就是这样：release 在 ubuntu-latest 上原生构建出
      # glibc 二进制，Dockerfile 却把它放进 alpine（musl），容器一启动就
      # `exec /app/nekomari: no such file or directory`（报的是找不到程序解释器）。
      # 三个工作流当时全绿，用户拉下来却跑不起来。
      #
      # 这里先把镜像按本机架构单平台 load 进来，真正执行一次 --help：
      # 动态链接器缺失/不匹配、架构不符、入口路径写错，都会在这里失败。
      - name: Smoke test the image actually starts
        run: |
          set -euo pipefail
          docker buildx build \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            --platform linux/amd64 \
            --load \
            -t ${{ matrix.name }}-smoke:local \
            -f ctx/${{ matrix.dockerfile }} ctx
          echo "--- 入口路径是否存在且可执行 ---"
          docker run --rm --entrypoint ${{ matrix.entrypoint }} ${{ matrix.name }}-smoke:local ${{ matrix.smoke_args }} > /tmp/smoke.txt 2>&1
          head -3 /tmp/smoke.txt
          echo "--- 入口是否报告了预期的自述 ---"
          grep -q "${{ matrix.smoke_expect }}" /tmp/smoke.txt
          echo "smoke test passed"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ctx
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dockerfile 里的 ARG TARGETOS/TARGETARCH 由 buildx 自动填充。
          provenance: false
      # 校验镜像确实可以被匿名拉取。
      #
      # 注意不要用「直接 curl manifest 看 401/200」来判断：GHCR 对公开包的首个
      # 无凭证请求同样返回 401，必须先换匿名 token。用 401 当私有信号会把公开
      # 镜像误判成私有（我一开始就是这么误判的）。
      - name: Verify the image is anonymously pullable
        if: always()
        run: |
          set +e
          REPO_LOWER=$(echo "${{ github.repository_owner }}/${{ matrix.package }}" | tr '[:upper:]' '[:lower:]')
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${REPO_LOWER}:pull&service=ghcr.io"             | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))')
          if [ -z "$TOKEN" ]; then
            echo "::warning::could not obtain an anonymous token; cannot verify pullability"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}'             -H "Authorization: Bearer $TOKEN"             -H "Accept: application/vnd.oci.image.index.v1+json"             "https://ghcr.io/v2/${REPO_LOWER}/manifests/${{ steps.tag.outputs.tag }}")
          echo "anonymous manifest fetch for ${REPO_LOWER}: HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::${REPO_LOWER} is not anonymously pullable (HTTP $CODE)."
            echo "::warning::Set it public under Package settings -> Change visibility,"
            echo "::warning::otherwise users must 'docker login ghcr.io' before pulling."
          fi
