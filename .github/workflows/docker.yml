name: docker

# 把已发布的二进制打包成多架构容器镜像，推到 GHCR。
#
# 设计说明
# --------
# 1) 为什么从 Release 附件构建，而不是在这里重新编译：
#    release.yml 已经按各平台原生构建好了产物（服务端依赖 CGO，交叉编译
#    需要额外工具链）。这里直接取用那些产物，既不必重复构建，也保证了
#    「镜像里的二进制」与「Release 里的二进制」是同一份。
#
# 2) Dockerfile 依赖产物位于构建上下文根目录且命名为 nekomari-<os>-<arch>，
#    这正是 release.yml 的命名，也是本工作流 --pattern 抓取的命名。
#    改任意一边都必须同步改另一边。
#
# 3) 只推 GHCR（用内置 GITHUB_TOKEN，无需额外密钥）。
#    要同时推 Docker Hub 的话，需要 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 两个
#    secret，这里刻意不默认开启，避免缺密钥时整个流程失败。

on:
  release:
    types: [published]
  # release.yml 是用 GITHUB_TOKEN 创建 Release 的，而 GitHub 会抑制由
  # GITHUB_TOKEN 触发的事件 —— 所以 release:published 在自动发布时【不会】
  # 触发本工作流（实测 v0.1.1 就没有触发）。workflow_run 正是为这种串联场景
  # 设计的：等 release 工作流跑完再取产物打镜像。
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build an image for (e.g. v0.1.1)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # release 与 workflow_run 可能同时命中，按 tag 去重避免重复推送。
  group: docker-${{ github.event.inputs.tag || github.event.workflow_run.head_branch || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    # workflow_run 时不关心成功与否就白跑，先判断结论。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            # workflow_run：tag 推送触发的 run 会把 tag 放在 head_branch 上。
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::resolved tag '$TAG' does not look like a release tag; nothing to build"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building image for $TAG"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 用 tag 本身而不是默认分支，保证 Dockerfile 与产物同代。
          ref: ${{ steps.tag.outputs.tag || github.ref }}

      # docker/build-push-action 的 file 是相对 context 解析的，
      # 所以 Dockerfile 必须和二进制放在同一个目录里。
      - name: Assemble the build context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ctx
          cp Dockerfile ctx/
          # 只要服务端产物：探针不进镜像（它跑在被监控的机器上）。
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'nekomari-*' \
            --dir ctx
          ls -la ctx

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.tag.outputs.tag, '-') }}
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dockerfile 里的 ARG TARGETOS/TARGETARCH 由 buildx 自动填充。
          provenance: false
      # 探测：GITHUB_TOKEN（带 packages: write）能否直接把包改成公开。
      # GHCR 新建的包默认私有，而对最终用户来说私有包等于不能用
      # （docker pull 需要登录）。这里逐个试候选端点并把结果打出来，
      # 以便确定到底哪条路可行 —— 而不是靠猜。
      - name: Probe package visibility endpoints
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "== token permissions in this run =="
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --jq '.permissions // "n/a"' 2>&1 | head -3

          try() {
            echo "--- $1"
            gh api -X PATCH "$1" -f visibility=public 2>&1 | head -c 300
            echo
          }
          try "user/packages/container/nekomari"
          try "repos/${{ github.repository }}/packages/container/nekomari"
          try "orgs/${{ github.repository_owner }}/packages/container/nekomari"

          echo "== 复核：匿名能否拉取 manifest =="
          curl -s -o /dev/null -w "anonymous manifest: %{http_code}\n" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/nekomari/manifests/${{ steps.tag.outputs.tag }}"
