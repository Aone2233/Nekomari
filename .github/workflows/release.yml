name: release

# 打 tag（v*）或手动触发时：构建服务端 + 前端 + 探针的多平台产物，并创建 Release。
#
# 设计说明
# --------
# 1) 为什么「在各自平台原生构建」而不是像上游那样用 zig 交叉编译：
#    服务端依赖 CGO（mattn/go-sqlite3），GOOS=linux CGO_ENABLED=0 会直接编译失败
#    （internal/sqlitetune/connector.go: conn.Exec undefined）。
#    上游的做法是引入 zig 当交叉编译器；这里改用 ubuntu-latest / windows-latest
#    各自原生构建 —— 每一步都与本地已经验证过的命令一致，不引入未经验证的环节。
#    （唯一的例外是 linux/arm64：在 amd64 runner 上用 gcc-aarch64-linux-gnu 交叉。）
#
# 2) 产物命名是【兼容契约】，不要随意改：
#    探针的自更新逻辑（agent/update/update.go 的 expectedAssetName）按
#    komari-agent-<goos>-<goarch>[.exe] 查找 Release 附件。
#    服务端产物用 nekomari-<goos>-<goarch>。
#    探针的更新源默认已是本仓库（agent/update/update.go 的 Repo），
#    所以这里产出的附件正是它要找的东西。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Required for manual runs.'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ''
            cc: aarch64-linux-gnu-gcc
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # The agent module requires a newer Go than the root (1.26.0 vs 1.25.0).
          # Reading the root go.mod installed too old a toolchain and the agent
          # build failed. This job builds both, so take the higher requirement.
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            agent/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install aarch64 cross toolchain
        if: matrix.cc != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build theme packer
        shell: bash
        run: |
          cd tools/zstdpack
          go build -o zstdpack${{ matrix.ext }} .

      - name: Pack embedded theme
        shell: bash
        run: |
          mkdir -p web/public/defaultTheme
          ./tools/zstdpack/zstdpack${{ matrix.ext }} \
            -src frontend/dist \
            -out web/public/defaultTheme/dist.tar.zst
          cp -f frontend/komari-theme.json web/public/defaultTheme/
          for f in preview.png perview.png preview.webp; do
            [ -f "frontend/$f" ] && cp -f "frontend/$f" web/public/defaultTheme/ || true
          done

      - name: Build server
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/Aone2233/nekomari/utils.CurrentVersion=${{ github.ref_name }}" \
            -o nekomari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Build agent
        shell: bash
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          # 文件名是探针自更新所依赖的契约，见文件头说明 2)
          go build -trimpath \
            -ldflags="-s -w -X github.com/Aone2233/nekomari/agent/update.CurrentVersion=${{ github.ref_name }}" \
            -o komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      # 把探针产物平铺到仓库根目录再上传。
      # 否则它会带着 agent/ 这一层目录进 artifact，而 download-artifact 的
      # merge-multiple 是保留 artifact 内部相对路径的 —— 结果发布时
      # dist/agent/komari-agent-* 被非递归的 dist/* 漏掉，
      # Release 里就只剩服务端产物，探针的自更新会找不到附件。
      - name: Stage release assets
        shell: bash
        run: |
          cp -f agent/komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nekomari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            nekomari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/**
          body: |
            ## Nekomari ${{ steps.tag.outputs.tag }}

            Self-hosted server monitoring — a maintained continuation of
            [Komari](https://github.com/komari-monitor/komari), forked from `1.5.0-fix1`.

            ### Downloads

            | File | What |
            |---|---|
            | `nekomari-<os>-<arch>` | Server + web panel (default theme embedded) |
            | `komari-agent-<os>-<arch>` | Monitoring agent (probe) |

            > The agent asset intentionally keeps the `komari-agent-` prefix: that is the
            > name the agent's self-updater looks for (`agent/update/update.go`).
            > Renaming it would break auto-update.

            ### Quick start

            ```bash
            ./nekomari-<os>-<arch> server              # then open http://localhost:25774
            ./komari-agent-<os>-<arch> -e https://your-panel -t <token>
            ```

            ### New in this fork

            - `netcheck` — probe which protocol a target actually answers, before you
              configure a monitoring task around it
            - ping task type `auto` — the agent picks a protocol the target answers
            - ping task type `dual` — measures ICMP and TCP side by side, so "target
              only answers TCP" stops looking like an outage
            - reference target on a ping task — compare the target against your gateway
              to tell a local problem from an upstream one
            - baseline alerting — alert on deviation from a rule's own P95 history
            - backup freshness metric (`backup.age_seconds` / `backup.ok`)
            - IP information API (`/api/*/ip-info/v1`) — geo, ASN, network type and
              Globalping latency, for themes that render an IP panel
            - address-family aware scheduling — a node with no IPv4 address is skipped
              on IPv4-literal targets instead of reporting a permanent 100% loss

            ### Container image

            ```bash
            docker run -d --name nekomari -p 25774:25774 \
              -v nekomari-data:/app/data \
              ghcr.io/aone2233/nekomari:${{ steps.tag.outputs.tag }}
            ```

            Multi-arch (`linux/amd64`, `linux/arm64`), anonymously pullable. The binary
            inside is the same one attached below, not a separate build.

            > **Always pass `-v`.** The image declares `VOLUME /app/data`, so without it
            > Docker creates an anonymous volume — and recreating the container (which
            > is what an image update does) attaches a different one, so the panel comes
            > up empty and shows the install wizard. The data is orphaned, not deleted.
            > A named volume or a bind mount both work.

            See [FORK.md](https://github.com/${{ github.repository }}/blob/main/FORK.md)
            for provenance, and `docs/TESTING.md` for which tests need a privileged or
            IPv6-capable host.

  # 发布后的部署验证：真的把 Release 产物当成"用户拿到的东西"跑一遍。
  #
  # 为什么必须有这一步：build 作业只证明【能编译】，release 作业只证明【能上传】。
  # 两者都不会发现"产物下载下来跑不起来"这类问题——v0.1.2 之前就发生过一次：
  # 镜像里的二进制与基础镜像 libc 不匹配，容器启动即崩，而当时所有流水线都是绿的。
  #
  # 这里下载刚发布的产物、校验 SHA256SUMS、启动服务端、走 API 完成首次安装、
  # 接一个 agent 并确认节点真的在上报。用的是独立端口与独立临时目录，
  # 脚本自己清理，所以在 runner 上不留痕迹。
  #
  # 放在 release 之后：产物必须先存在于 Release，才能像用户那样下载它们。
  verify:
    name: verify the release deploys
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the published artifacts and check they work
        run: |
          # Give the Release a moment to become downloadable, then run the same
          # script a user would: no source tree, no local build, only the assets.
          sleep 20
          bash deploy/deploy-verify.sh "" 25799 "${{ steps.tag.outputs.tag }}"