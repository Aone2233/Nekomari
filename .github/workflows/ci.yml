name: ci

# 每次 push / PR：构建并测试。
#
# 与 release.yml 保持同一套「各平台原生构建」的思路，原因见那个文件的头部说明：
# 服务端依赖 CGO（sqlite），交叉编译需要额外的 C 工具链，原生构建则与本地
# 已验证的命令完全一致。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-browser:
    name: frontend browser (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r script/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test frontend browser interactions and time-sensitive labels
        working-directory: frontend
        run: |
          python script/chart-a11y.spec.py
          python script/compiler-static.browser.spec.py
          python script/admin-clock.browser.spec.py
          python script/node-details.browser.spec.py
          python script/admin-mutations.browser.spec.py
          python script/offline-notification.browser.spec.py
          python script/file-manager.browser.spec.py
          python script/selector-state.browser.spec.py
          python script/number-picker.browser.spec.py
          python script/remote-file-tree.browser.spec.py
          python script/load-chart.browser.spec.py
          python script/metrics-settings.browser.spec.py
          python script/admin-node-table.browser.spec.py
          python script/admin-autodiscovery.browser.spec.py
          python script/icmp-capability.browser.spec.py
          python script/status-sla.browser.spec.py
          python script/bulk-edit.browser.spec.py
          python script/maintenance.browser.spec.py
          python script/config-export.browser.spec.py
          python script/forecast.browser.spec.py
          python script/account-sso-2fa.browser.spec.py
          python script/api-keys.browser.spec.py
          python script/client-token.browser.spec.py

  # The fixtures above mount one component against stubs. This job boots the
  # built server and walks the real panel instead, which is the only check that
  # catches a page that loops, crashes on mount, or is wired to a route that does
  # not exist: `pages/admin/settings/sign-on` looped on every visit while every
  # fixture stayed green, because nothing mounts that page.
  panel-smoke:
    name: panel smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build the panel, the embedded theme and the server
        run: |
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          (cd tools/zstdpack && go build -o zstdpack .)
          # Rebuild the committed Go-only fallback archive from this checkout's frontend.
          node script/embed-theme.mjs
          go build -o nekomari .
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          python -m pip install -r script/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Boot the server, install an account, and walk every route
        run: |
          mkdir -p smoke
          ./nekomari -d ./smoke/komari.db server -l 127.0.0.1:25774 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:25774/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:25774/ || { echo "server never became ready"; exit 1; }
          curl -sf -X POST http://127.0.0.1:25774/api/install/complete \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"E2e-verify1","sitename":"Nekomari CI","description":"CI smoke instance","metric_dsn":"./smoke/metrics.db"}'
          cd frontend && python script/panel-smoke.spec.py http://127.0.0.1:25774
          # The cd above leaves this shell inside frontend for the rest of the step.
          python script/admin-write-paths.spec.py http://127.0.0.1:25774
          python script/admin-navigation.spec.py http://127.0.0.1:25774
          python script/admin-tools-navigation.browser.spec.py \
            --panel-binary ../nekomari --dist dist \
            --output ../smoke/admin-tools-navigation.json
      - name: Check actual GeoIP settings reload in a synthetic Panel
        run: python3 deploy/geoip-reload-smoke.py --panel-binary ./nekomari
      - name: Check backup freshness notifications in a synthetic Panel
        run: python3 -W error::ResourceWarning deploy/backup-health-smoke.py --panel-binary ./nekomari
      - name: Check overlapping SLA task generations in a synthetic Panel
        run: python3 -W error::ResourceWarning deploy/sla-generations-smoke.py --panel-binary ./nekomari
      - name: Check nullable price expiry in the embedded admin UI
        run: python frontend/script/price-expiry.spec.py --panel-binary ./nekomari
      - name: Check uptime history ingestion and embedded admin UI
        run: python -W error::ResourceWarning frontend/script/uptime-history.spec.py --panel-binary ./nekomari
      - name: Check theme-cache diagnostics and authorization in the embedded admin UI
        run: python -W error::ResourceWarning frontend/script/theme-cache-diagnostics.spec.py --panel-binary ./nekomari
      - name: Restore a synthetic encrypted backup into an offline panel container
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          context=$(mktemp -d)
          image="nekomari-restore-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -rf "$context"; docker image rm "$image" >/dev/null 2>&1 || true' EXIT
          cp Dockerfile "$context/Dockerfile"
          cp nekomari "$context/nekomari-linux-amd64"
          docker build --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 -t "$image" "$context"
          digest=$(docker image inspect "$image" --format '{{.Id}}')
          python3 -W error::ResourceWarning deploy/encrypted_backup_drill_test.py \
            --panel-binary ./nekomari --panel-image "$digest"

  metric-recovery-sql:
    name: metric recovery (mysql + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: probe
          POSTGRES_PASSWORD: recovery-fixture-only
          POSTGRES_DB: recovery
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U probe -d recovery"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_ROOT_PASSWORD: recovery-root-fixture-only
          MYSQL_DATABASE: recovery
          MYSQL_USER: probe
          MYSQL_PASSWORD: recovery-fixture-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - name: Verify recovery bindings and sealed parents on both backends
        env:
          METRIC_POSTGRES_DSN: postgres://probe:recovery-fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/recovery?sslmode=disable
          METRIC_MYSQL_DSN: probe:recovery-fixture-only@tcp(127.0.0.1:${{ job.services.mysql.ports[3306] }})/recovery?parseTime=true
        run: go test -race -count=1 ./pkg/metric -run '^TestCoarseRecovery' -timeout 3m

  # Shell-level tests for the deployment scripts. Offline and hermetic: the
  # installer's own flags confine every write to a temp directory, so this needs
  # no host, no network and no root.
  deploy-scripts:
    name: deploy scripts (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test the agent installer's credential handling
        # The case that matters: `-t` must not survive into the unit's ExecStart.
        # See docs/SECRETS.md.
        run: bash deploy/install-node-agent.test.sh
      - name: Test the agent upgrade script
        # Idempotence via --version/SHA, init restart (systemd/OpenRC), capability
        # restore, and rollback-binary pruning are all offline contracts.
        run: bash deploy/upgrade-agent.test.sh
      - name: Test the panel health probe
        run: bash deploy/panel-probe.test.sh
      - name: Test the authenticated panel smoke (offline harness)
        # The real script needs a running panel and an API key; the harness pins
        # its decision table (skip, success, JSON-RPC error, bad theme asset).
        run: bash deploy/panel-auth-smoke.test.sh
      - name: Test explicit scoped-key provisioning (offline)
        run: python3 deploy/nekomari_auth_test.py
      - name: Test the Hermes node metadata client (offline)
        run: python3 -W error::ResourceWarning deploy/hermes_nodes_test.py
      - name: Test encrypted backups with throwaway identities (offline)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          python3 -W error::ResourceWarning deploy/encrypted_backup_test.py
      - name: Check the installed encrypted backup schedule contract (offline)
        run: |
          python3 deploy/encrypted_backup_schedule_test.py
          systemd-analyze verify deploy/hosts/nekomari-oc424-encrypted-backup.service deploy/hosts/nekomari-oc424-encrypted-backup.timer
      - name: Check encrypted backup health and bounded reporting (offline)
        run: |
          python3 -W error::ResourceWarning deploy/backup_health_test.py
          systemd-analyze verify deploy/hosts/nekomari-oc424-backup-health.service deploy/hosts/nekomari-oc424-backup-health.timer
      - name: Test the post-upgrade check (offline harness)
        run: bash deploy/panel-upgrade-check.test.sh
      - name: Test that the agent upgrade scripts preserve file capabilities
        # A binary replacement drops them (`cp`/`install` copy content and mode, never xattrs), and a node whose
        # agent runs as a non-root user unit needs `cap_net_raw` to probe ICMP at all — otherwise the panel
        # shows packet loss that belongs to the tooling rather than the target. This has already happened once.
        run: sh deploy/fleet/upgrade-agent.capability.test.sh

  # The docker workflow's own contracts, asserted against the workflow file instead of
  # against a human's memory: which releases are allowed to move `latest`, that no
  # ref-derived value reaches a `run:` script, and that the released agent image carries
  # the container marker. Deliberately a separate job rather than a step in
  # `deploy-scripts`: that job is offline and hermetic on purpose, and this one needs
  # PyYAML. The script itself exits 2 when the dependency is missing, so a broken
  # environment fails loudly instead of reporting a green run over nothing.
  workflow-contracts:
    name: workflow contracts (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the docker workflow's contracts
        run: |
          python -m pip install --quiet pyyaml
          python deploy/docker-workflow-check.py

      - name: Check that every `with:` input still exists on the pinned action
        # 这条检查的是「major 升级把某个 with: 输入删掉/改名」——那种失败只在
        # workflow 真正跑起来时才出现，对 release.yml 就是在发布时。脚本按
        # action.yml 逐个核对；读不到（composite/local）只打印，不算问题，
        # 所以网络抖动不会让它变红。
        run: python deploy/check-action-inputs.py

      - name: Check the published documentation site
        # site/README.md 说这一步 "not optional"：mkdocs --strict 能发现坏链，但
        # 发现不了「导航里点名了一个不存在的页面」，而那正是这个 check 的作用。
        # 站点发布在 nekomari-docs.66040321.xyz，构建发生在面板主机上 ——
        # 在此之前，文档站没有任何 CI。
        run: |
          node site/script/build.mjs stage
          node site/script/build.mjs check

  vulnerability-scan:
    name: vulnerability scan (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - name: Scan the server and the agent
        # release.yml 对每个发布产物跑 `govulncheck -mode=binary`，而那道门禁此前【只】在发版
        # 时存在。2026-10-13 的 v1.6.11 发布就是被它拦下的：钉住的 Go 1.27.1 标准库有 10 条
        # 漏洞（net/http、http2、mime/multipart、crypto/tls），全部 Fixed in go1.27.2 ——
        # 而在 main 上没有任何地方会发现这件事，第一次撞上就是发版失败、没有 Release。
        #
        # 这里用 source 模式：它按调用路径判断，快，且用同一个漏洞数据库；release 仍然扫真实
        # 二进制（更严格）。两个模块都扫，因为 agent 有自己的 go.mod，也进发布产物。
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
          cd agent
          govulncheck ./...

  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Pin the patched release compiler, independently of module minimums.
          go-version: '1.27.3'
          cache: true
          # Both modules are built from this one job.
          cache-dependency-path: |
            go.sum
            agent/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
          # React Compiler 建议。eslint 只启用了 8 条 react-hooks 规则，所以
          # `npm run lint` 对编译器会拦的形状是绿的 —— 这道门必须单独跑，否则
          # 「审计在 CI 里且报 0」只是文档里的说法。它此前确实不在任何 workflow 里，
          # 而那时它正带着 1 个 error 失败（frontend/src/pages/sla/index.tsx）。
          npm run audit:compiler
          npm run build

      - name: Build theme packer
        shell: bash
        run: |
          cd tools/zstdpack
          go build -o zstdpack${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Pack embedded theme
        shell: bash
        # 服务端用 //go:embed defaultTheme/dist.tar.zst 与 defaultTheme/komari-theme.json，
        # 这一步必须先于 go build，否则编译会直接失败（pattern: no matching files found）。
        run: |
          # 从仓库内的 frontend/dist 装配：面板自己的前台 + admin/ + standalone/ + 清单。
          # 归档提交在仓库里，是为了让纯 Go 环境也能 go build（frontend/dist 需要 Node 工具链）；
          # 而这里重建一次，保证**发出去的二进制**用的是当前源码。两者能同时成立的前提是输入
          # 都在本仓库 —— 2026-10-01 之前它来自另一个主题仓库，那时重建不可复现，所以只能提交。
          node script/embed-theme.mjs

      # 这里曾经想断言「提交的归档等于重建结果」（git diff --exit-code -- web/public/defaultTheme）。
      # 做不到，而且原因是可复现的：rollup 的 **chunk 切分**在两次构建之间会变。同一份源码，
      # 2026-10-13 实测 chunk-_layout.js 一次是「1 个 import 的小块」，另一次是「20+ import
      # 的大块」，143 个 chunk 的文件名哈希随之改变。逐个条目对比两个归档：所有差异都只出现在
      # 被引用的 chunk 文件名上，唯一的**结构性**差异就是切分本身 —— 所以不是时间戳，也不是
      # 内容，而是模块图遍历顺序（Windows 上 readdir 不排序）。
      #
      # 于是：归档里提交的那一份是权威的，发布工作流会重建它（保证二进制用的是当前源码），
      # 而「归档的内容是不是面板自己的文档」由 web/public 下的 Go 测试断言（embedded_theme_test.go、
      # standalone_pages_test.go、pwa_assets_test.go）—— 那些测试不依赖字节可复现。
      # tools/zstdpack 的 ModTime 归零仍然保留：它让「同一份 dist 打两次」字节相同，
      # 这是上面那条断言的前提之一，也是唯一被修掉的那一个来源。

      - name: Test server
        # 跑全部用例，只排除会真的访问第三方的那三个：上游 utils/geoip 的
        # TestIpInfo 打 ipinfo.io，TestIpApi 打 ip-api.com，TestGeojs 打 geojs.io。
        # 它们不是"错"的 —— 单独跑、由一台能出去的机器跑都通过 —— 但会把 CI 的
        # 结果绑在三个第三方配额上，两家是出了名的限流服务。
        #
        # 名字特意锚定（^...$）：本仓库另有三十多个 hermetic 的 TestIpInfo* 用例
        # （TestIpInfoLookup*、TestIpInfoIPAPICooldownOn429 等），它们用 httptest
        # 假上游，必须继续跑。上游那个 TestIpInfo 是唯一不带后缀的同名测试。
        #
        # TestMmdb 不在这里：它下载一份公共 MaxMind 库（8.5 MB，仓库里 .gitignore
        # 掉了），会通过，只是每次 CI 多下一次。想省这 8.5 MB 就该给它加缓存或改用
        # 夹具，而不是跳过——它测的是真实库的读取路径。
        #
        # 从「白名单 -run」改成「黑名单 -skip」是有意的：白名单让新测试默认不跑，
        # 实测只覆盖了 552 个用例中的 79 个，连 v0.1.9 新增的解锁与 ping 重传用例
        # 都没跑 —— 其中两个解锁用例从提交起就是失败的。详见 docs/TESTING.md。
        run: go test ./... -count=1 -skip '^TestIpInfo$|^TestIpApi$|^TestGeojs$'

      - name: Test agent
        # 全部用例，只排除三个真实网络/权限用例（需要 root、IPv6 与目标可达），
        # 它们在未改动的上游代码上同样失败，详见 docs/TESTING.md。
        # 黑名单而非白名单的理由见上面 "Test server" 那一段，这里沿用同一套。
        #
        # GITHUB_TOKEN 专给 agent/update 里那条真的打 api.github.com 的探针用例
        # （TestProbeRealTargetedUpdateSelection）：没有它 GitHub 只给 60 次/小时/IP，
        # 共享出口 IP 的 runner 上一律 403 —— 一个只改文档的 PR 就这样变红过一次。
        # 有它则是 5000 次/小时，那条用例才是可靠的。
        # 用内置的 secrets.GITHUB_TOKEN（本 job 的 permissions 已是 contents: read），
        # 不需要额外 secret；拿不到 secret 的场景（例如 Dependabot）它渲染成空串，
        # 那条用例会自己 skip 并说明原因，不会把一个只改文档的 PR 判红。
        working-directory: agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test ./... -count=1 -skip 'TestICMPPing|TestTCPPing|TestHTTPPing'

      - name: Vet server
        run: go vet ./...

      - name: Vet agent
        working-directory: agent
        run: go vet ./...

      - name: Race-check authentication and report queues
        if: runner.os == 'Linux'
        run: |
          # Hermetic provider lifecycle/reload regressions, not third-party lookups.
          go test -race ./utils/geoip -count=1 -run 'TestGeoIP|TestUpdateDatabase'
          go test -race ./web/public -count=1 -run 'TestThemeCacheSnapshot|TestThemeCacheDisabled|TestAnUnwritableCache'
          go test -race ./internal/backupwatch ./utils/messageSender/...
          go test -race ./internal/sla
          go test -race ./database/accounts ./web/api/public -count=10 -shuffle=on
          go test -race ./web/oauth/... ./web/security ./web/upload
          go test -race ./internal/apikeys ./pkg/rpc ./web/api ./web/router ./web/rpc/jsonrpc
          go test -race ./database/clients ./web/agent ./web/api/client ./internal/server
          go test -race ./internal/clientguard ./web/api/terminal ./web/filemanager ./web/connection

      - name: Build server
        run: go build -o /dev/null .
        if: runner.os != 'Windows'
        shell: bash

      - name: Build server (Windows)
        run: go build -o NUL .
        if: runner.os == 'Windows'
        shell: bash

      - name: Build agent
        working-directory: agent
        shell: bash
        run: go build -o /dev/null . || go build -o NUL .
