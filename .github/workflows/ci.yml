name: ci

# 每次 push / PR：构建并测试。
#
# 与 release.yml 保持同一套「各平台原生构建」的思路，原因见那个文件的头部说明：
# 服务端依赖 CGO（sqlite），交叉编译需要额外的 C 工具链，原生构建则与本地
# 已验证的命令完全一致。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # The agent is a separate module and requires a NEWER Go than the root
          # (agent/go.mod says 1.26.0, the root says 1.25.0). Reading the root
          # go.mod installed 1.25.0, and the agent tests then failed with
          # "go.mod requires go >= 1.26.0". Point at the higher of the two.
          go-version-file: agent/go.mod
          cache: true
          # Both modules are built from this one job.
          cache-dependency-path: |
            go.sum
            agent/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build theme packer
        shell: bash
        run: |
          cd tools/zstdpack
          go build -o zstdpack${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Pack embedded theme
        shell: bash
        # 服务端用 //go:embed defaultTheme/dist.tar.zst，这一步必须先于 go build，
        # 否则编译会直接失败（pattern: no matching files found）。
        run: |
          mkdir -p web/public/defaultTheme
          ./tools/zstdpack/zstdpack${{ runner.os == 'Windows' && '.exe' || '' }} \
            -src frontend/dist \
            -out web/public/defaultTheme/dist.tar.zst
          cp -f frontend/komari-theme.json web/public/defaultTheme/
          for f in preview.png perview.png preview.webp; do
            [ -f "frontend/$f" ] && cp -f "frontend/$f" web/public/defaultTheme/ || true
          done

      - name: Test server
        # 跑全部用例，只排除已知不密封的那一个：上游 utils/geoip 的 TestIpInfo 会真的
        # 请求 ipinfo.io（Nekomari 新增的 TestIpInfo* 不匹配这个锚定正则，仍会运行）。
        #
        # 从「白名单 -run」改成「黑名单 -skip」是有意的：白名单让新测试默认不跑，
        # 实测只覆盖了 552 个用例中的 79 个，连 v0.1.9 新增的解锁与 ping 重传用例
        # 都没跑 —— 其中两个解锁用例从提交起就是失败的。详见 docs/TESTING.md。
        run: go test ./... -count=1 -skip '^TestIpInfo$'

      - name: Test agent
        # 全部用例，只排除三个真实网络/权限用例（需要 root、IPv6 与目标可达），
        # 它们在未改动的上游代码上同样失败，详见 docs/TESTING.md。
        working-directory: agent
        run: go test ./... -count=1 -skip 'TestICMPPing|TestTCPPing|TestHTTPPing'

      - name: Build server
        run: go build -o /dev/null .
        if: runner.os != 'Windows'
        shell: bash

      - name: Build server (Windows)
        run: go build -o NUL .
        if: runner.os == 'Windows'
        shell: bash

      - name: Build agent
        working-directory: agent
        shell: bash
        run: go build -o /dev/null . || go build -o NUL .
