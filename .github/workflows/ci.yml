name: ci

# 每次 push / PR：构建并测试。
#
# 与 release.yml 保持同一套「各平台原生构建」的思路，原因见那个文件的头部说明：
# 服务端依赖 CGO（sqlite），交叉编译需要额外的 C 工具链，原生构建则与本地
# 已验证的命令完全一致。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-browser:
    name: frontend browser (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r script/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test frontend browser interactions and time-sensitive labels
        working-directory: frontend
        run: |
          python script/chart-a11y.spec.py
          python script/compiler-static.browser.spec.py
          python script/admin-clock.browser.spec.py
          python script/node-details.browser.spec.py
          python script/admin-mutations.browser.spec.py
          python script/offline-notification.browser.spec.py
          python script/file-manager.browser.spec.py
          python script/selector-state.browser.spec.py
          python script/number-picker.browser.spec.py
          python script/remote-file-tree.browser.spec.py
          python script/load-chart.browser.spec.py
          python script/metrics-settings.browser.spec.py
          python script/admin-node-table.browser.spec.py
          python script/admin-autodiscovery.browser.spec.py
          python script/icmp-capability.browser.spec.py
          python script/status-sla.browser.spec.py
          python script/bulk-edit.browser.spec.py
          python script/maintenance.browser.spec.py
          python script/config-export.browser.spec.py
          python script/forecast.browser.spec.py
          python script/account-sso-2fa.browser.spec.py

  # The fixtures above mount one component against stubs. This job boots the
  # built server and walks the real panel instead, which is the only check that
  # catches a page that loops, crashes on mount, or is wired to a route that does
  # not exist: `pages/admin/settings/sign-on` looped on every visit while every
  # fixture stayed green, because nothing mounts that page.
  panel-smoke:
    name: panel smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build the panel, the embedded theme and the server
        run: |
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          (cd tools/zstdpack && go build -o zstdpack .)
          # The embedded archive is committed, not built here: it is the theme's build output, from a
          # repository this one does not contain. The script checks what is committed and explains how to
          # regenerate it. See the header of script/embed-theme.mjs.
          node script/embed-theme.mjs
          go build -o nekomari .
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          python -m pip install -r script/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Boot the server, install an account, and walk every route
        run: |
          mkdir -p smoke
          ./nekomari -d ./smoke/komari.db server -l 127.0.0.1:25774 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:25774/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:25774/ || { echo "server never became ready"; exit 1; }
          curl -sf -X POST http://127.0.0.1:25774/api/install/complete \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"E2e-verify1","sitename":"Nekomari CI","description":"CI smoke instance","metric_dsn":"./smoke/metrics.db"}'
          cd frontend && python script/panel-smoke.spec.py http://127.0.0.1:25774
          # The cd above leaves this shell inside frontend for the rest of the step.
          python script/admin-write-paths.spec.py http://127.0.0.1:25774
          python script/admin-navigation.spec.py http://127.0.0.1:25774

  # Shell-level tests for the deployment scripts. Offline and hermetic: the
  # installer's own flags confine every write to a temp directory, so this needs
  # no host, no network and no root.
  deploy-scripts:
    name: deploy scripts (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test the agent installer's credential handling
        # The case that matters: `-t` must not survive into the unit's ExecStart.
        # See docs/SECRETS.md.
        run: bash deploy/install-node-agent.test.sh
      - name: Test the panel health probe
        run: bash deploy/panel-probe.test.sh
      - name: Test that the agent upgrade scripts preserve file capabilities
        # A binary replacement drops them (`cp`/`install` copy content and mode, never xattrs), and a node whose
        # agent runs as a non-root user unit needs `cap_net_raw` to probe ICMP at all — otherwise the panel
        # shows packet loss that belongs to the tooling rather than the target. This has already happened once.
        run: sh deploy/fleet/upgrade-agent.capability.test.sh

  # The docker workflow's own contracts, asserted against the workflow file instead of
  # against a human's memory: which releases are allowed to move `latest`, that no
  # ref-derived value reaches a `run:` script, and that the released agent image carries
  # the container marker. Deliberately a separate job rather than a step in
  # `deploy-scripts`: that job is offline and hermetic on purpose, and this one needs
  # PyYAML. The script itself exits 2 when the dependency is missing, so a broken
  # environment fails loudly instead of reporting a green run over nothing.
  workflow-contracts:
    name: workflow contracts (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the docker workflow's contracts
        run: |
          python -m pip install --quiet pyyaml
          python deploy/docker-workflow-check.py

  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Pin the patched release compiler, independently of module minimums.
          go-version: '1.27.1'
          cache: true
          # Both modules are built from this one job.
          cache-dependency-path: |
            go.sum
            agent/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
          npm run build

      - name: Build theme packer
        shell: bash
        run: |
          cd tools/zstdpack
          go build -o zstdpack${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Pack embedded theme
        shell: bash
        # 服务端用 //go:embed defaultTheme/dist.tar.zst 与 defaultTheme/komari-theme.json，
        # 这一步必须先于 go build，否则编译会直接失败（pattern: no matching files found）。
        run: |
          # 从仓库内的 frontend/dist 装配：面板自己的前台 + admin/ + standalone/ + 清单。
          # 归档提交在仓库里，是为了让纯 Go 环境也能 go build（frontend/dist 需要 Node 工具链）；
          # 而这里重建一次，保证**发出去的二进制**用的是当前源码。两者能同时成立的前提是输入
          # 都在本仓库 —— 2026-10-01 之前它来自另一个主题仓库，那时重建不可复现，所以只能提交。
          node script/embed-theme.mjs

      - name: Test server
        # 跑全部用例，只排除会真的访问第三方的那三个：上游 utils/geoip 的
        # TestIpInfo 打 ipinfo.io，TestIpApi 打 ip-api.com，TestGeojs 打 geojs.io。
        # 它们不是"错"的 —— 单独跑、由一台能出去的机器跑都通过 —— 但会把 CI 的
        # 结果绑在三个第三方配额上，两家是出了名的限流服务。
        #
        # 名字特意锚定（^...$）：本仓库另有三十多个 hermetic 的 TestIpInfo* 用例
        # （TestIpInfoLookup*、TestIpInfoIPAPICooldownOn429 等），它们用 httptest
        # 假上游，必须继续跑。上游那个 TestIpInfo 是唯一不带后缀的同名测试。
        #
        # TestMmdb 不在这里：它下载一份公共 MaxMind 库（8.5 MB，仓库里 .gitignore
        # 掉了），会通过，只是每次 CI 多下一次。想省这 8.5 MB 就该给它加缓存或改用
        # 夹具，而不是跳过——它测的是真实库的读取路径。
        #
        # 从「白名单 -run」改成「黑名单 -skip」是有意的：白名单让新测试默认不跑，
        # 实测只覆盖了 552 个用例中的 79 个，连 v0.1.9 新增的解锁与 ping 重传用例
        # 都没跑 —— 其中两个解锁用例从提交起就是失败的。详见 docs/TESTING.md。
        run: go test ./... -count=1 -skip '^TestIpInfo$|^TestIpApi$|^TestGeojs$'

      - name: Test agent
        # 全部用例，只排除三个真实网络/权限用例（需要 root、IPv6 与目标可达），
        # 它们在未改动的上游代码上同样失败，详见 docs/TESTING.md。
        # 黑名单而非白名单的理由见上面 "Test server" 那一段，这里沿用同一套。
        #
        # GITHUB_TOKEN 专给 agent/update 里那条真的打 api.github.com 的探针用例
        # （TestProbeRealTargetedUpdateSelection）：没有它 GitHub 只给 60 次/小时/IP，
        # 共享出口 IP 的 runner 上一律 403 —— 一个只改文档的 PR 就这样变红过一次。
        # 有它则是 5000 次/小时，那条用例才是可靠的。
        # 用内置的 secrets.GITHUB_TOKEN（本 job 的 permissions 已是 contents: read），
        # 不需要额外 secret；拿不到 secret 的场景（例如 Dependabot）它渲染成空串，
        # 那条用例会自己 skip 并说明原因，不会把一个只改文档的 PR 判红。
        working-directory: agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test ./... -count=1 -skip 'TestICMPPing|TestTCPPing|TestHTTPPing'

      - name: Vet server
        run: go vet ./...

      - name: Vet agent
        working-directory: agent
        run: go vet ./...

      - name: Race-check authentication
        if: runner.os == 'Linux'
        run: |
          go test -race ./database/accounts ./web/api/public -count=10 -shuffle=on
          go test -race ./web/oauth/... ./web/security ./web/upload

      - name: Build server
        run: go build -o /dev/null .
        if: runner.os != 'Windows'
        shell: bash

      - name: Build server (Windows)
        run: go build -o NUL .
        if: runner.os == 'Windows'
        shell: bash

      - name: Build agent
        working-directory: agent
        shell: bash
        run: go build -o /dev/null . || go build -o NUL .
